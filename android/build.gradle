group 'org.jitsi.jitsi_meet_flutter_sdk'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Local Maven repository containing the custom E2EE-enabled Jitsi Meet SDK
// build (see E2EE-IMPLEMENTATION-GUIDE.md). The path is provided via the
// `jitsiE2EEMavenRepo` gradle property (set in the app's gradle.properties).
def e2eeMavenRepo = rootProject.findProperty('jitsiE2EEMavenRepo')

rootProject.allprojects {
    repositories {
        if (e2eeMavenRepo != null) {
            maven {
                url "file://${e2eeMavenRepo}"
            }
        }
        maven {
            url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases"
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'org.jitsi.jitsi_meet_flutter_sdk'
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
 
    packagingOptions {
        pickFirst 'androidx/media3/exoplayer/rtsp/RtspMediaSource.class'
        pickFirst 'androidx/media3/exoplayer/rtsp/RtspMediaSource$Factory.class'
    }
}

configurations.all {
    exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
}
 
dependencies {
    implementation ("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version")
    implementation ("org.jitsi.react:jitsi-meet-sdk:13.1.1-e2ee.1") {
        transitive = true
    }
}
